<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <article class="sign-up-card">
        <div class="product-image">
            <img src="./images/halie-west-25xggax4bSA-unsplash.jpg" alt="product image" class="bg-image">
            <div class="logo-wrapper">
                <img src="./images/Odin-logo.png" alt="Odin logo" id="odin-logo">
                <span class="logo-text">ODIN</span>
            </div>
        </div>
        <div class="sign-up-form">
            <div class="intro-text">
                <p>
                    This is not a real online service! You know you need something
                    like this in your life to help you realize you deepest dreams.
                    Sign up now to get started.
                </p>
                <p>You know you want to</p>
            </div>

            <div>
                <p>Let's do this!</p>
                <form action="">
                    <div class="input-container">
                        <div class="input-wrapper left-input">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" name="first-name" id="first-name">
                        </div>

                        <div class="input-wrapper">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" for="last-name" id="last-name">
                        </div>
                    </div>

                    <div class="input-container">
                        <div class="input-wrapper left-input">
                            <label for="email">EMAIL</label>
                            <input type="email" for="email" id="email">
                        </div>

                        <div class="input-wrapper">
                            <label for="phone">PHONE NUMBER</label>
                            <input type="tel" for="phone" id="phone">
                        </div>
                    </div>

                    <div class="input-container">
                        <div class="input-wrapper left-input">
                            <label for="password">PASSWORD</label>
                            <input type="password" for="password" id="password">
                        </div>
                        
                        <div class="input-wrapper">
                            <label for="confirm-password">CONFIRM PASSWORD</label>
                            <input type="password" for="confirm-password" id="confirm-password">
                        </div>
                    </div>

                    <div class="btn-wrapper">
                        <button id="account-btn">Create Account</button>
                    </div>

                    <div class="login-prompt">
                        <p>Already have an account? <a href="#">Log in</a></p>
                    </div>
                </form>

            </div>
        </div>
    </article>
    
</body>
</html>
